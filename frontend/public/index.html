<!doctype html>
<html lang="en-IN">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <!-- The app's actual background, hsl(20 8% 4%) — warm-tinted near-black,
             not pure #000. On Android Chrome this paints the address bar, so a
             pure black here shows as a seam above the page. -->
        <meta name="theme-color" content="#F6F4F1" />

        <title>WeAre Creators — Influencer marketing across India, run end to end</title>
        <meta
            name="description"
            content="WeAre Creators runs influencer marketing campaigns across India, end to end. Brands post a brief; we cast verified creators, agree every rate in writing, run the shoot and send the report. Food and drink, hospitality, retail, real estate, fashion, travel, wellness and lifestyle."
        />

        <!-- Fonts are self-hosted (see the top of src/index.css). One preload:
             the upright Fraunces file the hero headline is set in, which is
             the LCP element. crossorigin is required on a font preload even
             same-origin, or the browser fetches the file twice. -->
        <link
            rel="preload"
            href="%PUBLIC_URL%/fonts/fraunces-latin-normal.woff2"
            as="font"
            type="font/woff2"
            crossorigin
        />

        <!-- Icons. SVG for anything current, PNG for Safari and home screens.
             All of them are the tree knocked out of a brand-red tile, generated
             by `scripts/trace-logo.py` alongside the lockups in /brand.

             The tree's negative-space hairlines need about 32px to read as a
             tree; below that it is a light mark on a red tile. That is why the
             smallest declared bitmap is 32 and there is no 16 — a browser that
             wants 16 renders the SVG down rather than being handed a bitmap
             built to fail at it. -->
        <link rel="icon" href="%PUBLIC_URL%/favicon.svg" type="image/svg+xml" />
        <link rel="icon" href="%PUBLIC_URL%/favicon-32.png" sizes="32x32" type="image/png" />
        <link rel="icon" href="%PUBLIC_URL%/favicon-192.png" sizes="192x192" type="image/png" />
        <link rel="icon" href="%PUBLIC_URL%/favicon-512.png" sizes="512x512" type="image/png" />
        <link rel="apple-touch-icon" href="%PUBLIC_URL%/apple-touch-icon.png" />

        <!-- Link previews. Most of our traffic arrives as a link pasted into
             WhatsApp, so this is the first thing a creator or a brand ever sees
             of the product.

             %PUBLIC_URL% resolves at build time. WhatsApp and X want an
             absolute image URL, so build with PUBLIC_URL set to the site
             origin — `PUBLIC_URL=https://your-domain npm run build` — and add
             an og:url below once the canonical domain is fixed. -->
        <meta property="og:type" content="website" />
        <meta property="og:site_name" content="WeAre Creators" />
        <meta property="og:locale" content="en_IN" />
        <meta property="og:title" content="Influencer marketing, run end to end." />
        <meta
            property="og:description"
            content="Brands post a brief. We cast verified creators, agree every rate in writing, run the shoot and send the report — across India, in every sector we run."
        />
        <!-- STALE: og-image.png still carries the old ember square and serif
             W. It was deliberately not regenerated with the rest of the icons
             — this is the site card a stranger sees when a link is pasted into
             WhatsApp, so it wants laying out by somebody rather than tracing,
             and the real vector is still to come. Regenerate it with the tree
             and the stacked lockup when that lands. -->
        <meta property="og:image" content="%PUBLIC_URL%/og-image.png" />
        <meta property="og:image:width" content="1200" />
        <meta property="og:image:height" content="630" />
        <meta
            property="og:image:alt"
            content="WeAre Creators — influencer marketing across India, run end to end"
        />

        <meta name="twitter:card" content="summary_large_image" />
        <meta name="twitter:title" content="Influencer marketing, run end to end." />
        <meta
            name="twitter:description"
            content="Brands post a brief. We cast verified creators, agree every rate in writing, run the shoot and send the report — across India, in every sector we run."
        />
        <meta name="twitter:image" content="%PUBLIC_URL%/og-image.png" />
    <!--
      Theme, before first paint.

      React cannot do this: the bundle has to download, parse and mount before
      it can set an attribute, and on the mid-range Android and Indian mobile
      data this product is built for that is a real interval spent looking at
      the wrong surface. A flash of the wrong theme is worse than no theme.

      Light is the default document and needs nothing written. The script
      writes data-theme="dark" for the marketing routes and, inside /admin,
      for an admin whose cached choice is dark — and for nothing else. The
      precedence matches `surfaceFor` in lib/surfaceTheme.js, and a test pins
      that the two agree.
    -->
    <script>
      /* Which surface this page is on, before first paint.
         
         LIGHT is the app and is the absence of the attribute. DARK is asked
         for: by the marketing routes, which were drawn for the navy set, and
         inside the console by an admin who chose it. Getting this wrong for
         even one frame is the whole reason the script exists.
         
         **This must agree with `isProductPath` in `lib/surfaceTheme.js`**, and
         a test fails the two if the prefix lists drift. It is duplicated
         rather than imported because nothing has loaded yet; that is the
         trade, and the test is what pays for it. */
      (function () {
        try {
          var path = location.pathname;
          var PRODUCT = [
            "/dashboard", "/onboarding", "/profile", "/admin",
            "/manager", "/calendar", "/check-in", "/brand/"
          ];
          var isProduct =
            path === "/campaigns/new" ||
            /^\/campaigns\/[^/]+\/edit\/?$/.test(path) ||
            PRODUCT.some(function (p) {
              return path === p.replace(/\/$/, "") || path.indexOf(p) === 0;
            });

          /* Home, /for-brands and /for-creators are drawn on the light set —
             exact paths, the same list as LIGHT_MARKETING_PATHS. */
          var LIGHT = ["/", "/for-brands", "/for-creators"];
          var bare = path.length > 1 ? path.replace(/\/+$/, "") : path;
          var theme = "light";
          if (!isProduct && LIGHT.indexOf(bare) === -1) {
            theme = "dark"; /* the rest of marketing keeps its navy set */
          } else if (path.indexOf("/admin") === 0) {
            /* An explicit choice, cached from the account. Never the
               operating system: dark is an opt-in, not a default. */
            var stored = null;
            try { stored = localStorage.getItem("weare:console-theme"); } catch (e) {}
            if (stored === "dark") theme = "dark";
          }
          if (theme === "dark") {
            document.documentElement.setAttribute("data-theme", "dark");
            document.documentElement.style.colorScheme = "dark";
          } else {
            document.documentElement.style.colorScheme = "light";
          }
        } catch (e) {
          /* Light is the absence of the attribute, so a throw lands on the
             app's own surface. On a marketing route that is the wrong
             surface for a moment, which the guard corrects on mount. */
        }
      })();
    </script>
  </head>

        <noscript>You need to enable JavaScript to run this app.</noscript>
        <div id="root"></div>
