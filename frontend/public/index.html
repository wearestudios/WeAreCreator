<!doctype html>
<html lang="en-IN">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <!-- The app's actual background, hsl(20 8% 4%) — warm-tinted near-black,
             not pure #000. On Android Chrome this paints the address bar, so a
             pure black here shows as a seam above the page. -->
        <meta name="theme-color" content="#0B0A09" />

        <title>WeAre Creators — Paid campaigns for verified creators in Bengaluru</title>
        <meta
            name="description"
            content="WeAre Creators connects verified Bengaluru creators with cafés, restaurants, hotels, retail and fashion brands running paid campaigns. Brands post the brief; we verify the creator, book the slot and settle the payment."
        />

        <!-- Fonts. One stylesheet: Fraunces for headings, Inter Tight for body.
             preconnect to gstatic needs crossorigin because the font files
             themselves are fetched anonymously. -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

        <!-- Icons. SVG for anything current, PNG for Safari and home screens. -->
        <link rel="icon" href="%PUBLIC_URL%/favicon.svg" type="image/svg+xml" />
        <link rel="icon" href="%PUBLIC_URL%/favicon-32.png" sizes="32x32" type="image/png" />
        <link rel="apple-touch-icon" href="%PUBLIC_URL%/apple-touch-icon.png" />

        <!-- Link previews. Most of our traffic arrives as a link pasted into
             WhatsApp, so this is the first thing a creator or a brand ever sees
             of the product.

             %PUBLIC_URL% resolves at build time. WhatsApp and X want an
             absolute image URL, so build with PUBLIC_URL set to the site
             origin — `PUBLIC_URL=https://your-domain npm run build` — and add
             an og:url below once the canonical domain is fixed. -->
        <meta property="og:type" content="website" />
        <meta property="og:site_name" content="WeAre Creators" />
        <meta property="og:locale" content="en_IN" />
        <meta property="og:title" content="Paid campaigns for verified creators." />
        <meta
            property="og:description"
            content="Verified Bengaluru creators, paid briefs from cafés, restaurants, hotels, retail and fashion brands. Brief to booking to payment, in one place."
        />
        <meta property="og:image" content="%PUBLIC_URL%/og-image.png" />
        <meta property="og:image:width" content="1200" />
        <meta property="og:image:height" content="630" />
        <meta
            property="og:image:alt"
            content="WeAre Creators — paid campaigns for verified creators"
        />

        <meta name="twitter:card" content="summary_large_image" />
        <meta name="twitter:title" content="Paid campaigns for verified creators." />
        <meta
            name="twitter:description"
            content="Verified Bengaluru creators, paid briefs from cafés, restaurants, hotels, retail and fashion brands. Brief to booking to payment, in one place."
        />
        <meta name="twitter:image" content="%PUBLIC_URL%/og-image.png" />
    <!--
      Theme, before first paint.

      React cannot do this: the bundle has to download, parse and mount before
      it can set an attribute, and on the mid-range Android and Indian mobile
      data this product is built for that is a real interval spent looking at
      a full-screen dark page that is about to become light. A flash of the
      wrong theme is worse than no theme.

      **Only on /admin**, which is the whole of the scoping. The marketing
      site, the creator app, the brand app and the manager screens never get
      the attribute and so cannot be affected by what it means.

      Kept deliberately small and dependency-free, because it is inline and
      blocking. The precedence it implements is the same one `resolveTheme`
      in lib/consoleTheme.js implements — explicit choice, then this browser's
      cache of one, then the operating system — and a test pins that the two
      agree.
    -->
    <script>
      (function () {
        try {
          if (location.pathname.indexOf("/admin") !== 0) return;
          var stored = null;
          try { stored = localStorage.getItem("weare:console-theme"); } catch (e) {}
          var theme =
            stored === "light" || stored === "dark"
              ? stored
              : window.matchMedia &&
                window.matchMedia("(prefers-color-scheme: light)").matches
              ? "light"
              : "dark";
          if (theme === "light") {
            document.documentElement.setAttribute("data-theme", "light");
            document.documentElement.style.colorScheme = "light";
          }
        } catch (e) {
          /* Dark is the absence of the attribute, so a throw here lands on
             the theme the console has always had rather than on nothing. */
        }
      })();
    </script>

    <!-- Search Console. %REACT_APP_SEARCH_CONSOLE_TOKEN% is substituted at
         build time from the environment, so the token is never committed —
         the rule the Maps key already holds. With the variable unset CRA
         leaves the placeholder in place, which Google simply does not match,
         so an unverified build fails closed rather than claiming a property
         it does not own. Set it in the deploy environment and rebuild. -->
    <meta
      name="google-site-verification"
      content="%REACT_APP_SEARCH_CONSOLE_TOKEN%"
    />

    <!-- The organisation, for a crawler that reads this shell.
         Every server-rendered page carries the same block in its own head —
         these are the only pages a non-JS crawler can read at all, which is
         why the entity is stated in both places rather than only here. Keep
         the two in step: a test asserts this one names the same company. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "WeAre Creators",
        "url": "https://wearecreators.in",
        "logo": "https://wearecreators.in/og-image.png",
        "email": "creators@wearemonk.in",
        "description": "WeAre Creators runs paid influencer campaigns end to end for brands in Bengaluru — casting verified creators, agreeing the rate in writing, running the shoot and reporting what it did.",
        "areaServed": { "@type": "City", "name": "Bengaluru" },
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Bengaluru",
          "addressRegion": "Karnataka",
          "addressCountry": "IN"
        }
      }
    </script>

    <!-- India, said explicitly. Weak signals on their own and free to send;
         the alternative is letting a crawler guess. -->
    <meta name="geo.region" content="IN-KA" />
    <meta name="geo.placename" content="Bengaluru" />
    <meta name="ICBM" content="12.9716, 77.5946" />
  </head>
    <body>
        <noscript>You need to enable JavaScript to run this app.</noscript>
        <div id="root"></div>

</html>
