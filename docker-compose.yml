# Run the whole site locally: MongoDB, the API, and the frontend dev server.
#
#   cp backend/.env.example backend/.env
#   docker compose up
#   open http://localhost:3000
#
# Everything is mounted from the working tree, so edits reload without a rebuild.
# This is a preview/development setup — it is not hardened for production.

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      # Exposed so you can point mongosh or Compass at it.
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    image: python:3.11-slim
    working_dir: /app
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "8001:8001"
    volumes:
      - ./backend:/app
      - pip_cache:/root/.cache/pip
    env_file:
      - ./backend/.env
    environment:
      # Compose networking overrides whatever host is in .env.
      MONGO_URL: mongodb://mongo:27017
      CORS_ORIGINS: http://localhost:3000
    # The dev set, not the runtime one: this stack mounts the source and runs
    # with --reload, and `pytest tests/` is meant to be runnable against it.
    # requirements-dev.txt pulls in requirements.txt, so the app still gets
    # exactly what production gets.
    command: >
      sh -c "pip install --quiet -r requirements-dev.txt &&
             uvicorn server:app --host 0.0.0.0 --port 8001 --reload"

  frontend:
    image: node:20-slim
    working_dir: /app
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - node_modules:/app/node_modules
    environment:
      REACT_APP_BACKEND_URL: http://localhost:8001
      # The dev server runs outside a TTY here.
      CI: "false"
      WATCHPACK_POLLING: "true"
    # `npm ci` and nothing else: the lockfile is committed, the peer tree
    # resolves without flags, and the private visual-edits package that the
    # old retry-dance worked around is gone from package.json.
    command: >
      sh -c "npm ci --no-audit --no-fund && npm start"

volumes:
  mongo_data:
  node_modules:
  pip_cache:
