# Run the whole site locally: MongoDB, the API, and the frontend dev server.
#
#   cp backend/.env.example backend/.env
#   docker compose up
#   open http://localhost:3000
#
# Everything is mounted from the working tree, so edits reload without a rebuild.
# This is a preview/development setup — it is not hardened for production.

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      # Exposed so you can point mongosh or Compass at it.
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    image: python:3.11-slim
    working_dir: /app
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "8001:8001"
    volumes:
      - ./backend:/app
      - pip_cache:/root/.cache/pip
    env_file:
      - ./backend/.env
    environment:
      # Compose networking overrides whatever host is in .env.
      MONGO_URL: mongodb://mongo:27017
      CORS_ORIGINS: http://localhost:3000
    command: >
      sh -c "pip install --quiet -r requirements.txt &&
             uvicorn server:app --host 0.0.0.0 --port 8001 --reload"

  frontend:
    image: node:20-slim
    working_dir: /app
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - node_modules:/app/node_modules
    environment:
      REACT_APP_BACKEND_URL: http://localhost:8001
      # The dev server runs outside a TTY here.
      CI: "false"
      WATCHPACK_POLLING: "true"
    command: >
      sh -c "npm install --legacy-peer-deps --no-audit --no-fund || (
               echo 'Retrying without the private visual-edits package' &&
               node -e \"const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));delete p.devDependencies['@emergentbase/visual-edits'];fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\\n')\" &&
               npm install --legacy-peer-deps --no-audit --no-fund
             ) && npm start"

volumes:
  mongo_data:
  node_modules:
  pip_cache:
