name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    env:
      # The unit suite never opens a connection — Motor connects lazily — but
      # importing server.py reads these at module scope.
      MONGO_URL: mongodb://localhost:27017
      DB_NAME: wearecreators_ci
      JWT_SECRET: ci-secret-not-used-for-anything-real
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install fastapi==0.110.1 'pydantic>=2.6.4' 'email-validator>=2.2.0' \
            'pyjwt>=2.10.1' bcrypt==4.1.3 motor==3.3.1 pymongo==4.6.3 \
            httpx==0.28.1 python-dotenv 'pytest>=8.0.0' 'pytest-xdist>=3.6.0' \
            'flake8>=7.0.0'

      - name: Import check
        working-directory: backend
        run: python -c "import server; print(f'{len(server.app.routes)} routes registered')"

      - name: Lint (syntax and undefined names only)
        working-directory: backend
        run: flake8 server.py --select=E9,F63,F7,F82,F821 --show-source

      - name: Unit tests
        working-directory: backend
        # tests/ (the integration suite) needs a running preview backend and
        # greps the supervisor log for OTP codes, so it cannot gate a PR.
        # tests/unit runs anywhere.
        run: python -m pytest tests/unit -q

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: frontend
        # @emergentbase/visual-edits is served from a private host and is only
        # used by the dev server (craco.config.js already guards for its
        # absence). If the runner can't reach it, drop it and build anyway
        # rather than failing the whole job on a tool the build doesn't use.
        run: |
          npm install --legacy-peer-deps --no-audit --no-fund || {
            echo "::warning::Install failed; retrying without @emergentbase/visual-edits"
            node -e "
              const fs = require('fs');
              const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
              delete pkg.devDependencies['@emergentbase/visual-edits'];
              fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
            "
            npm install --legacy-peer-deps --no-audit --no-fund
          }

      - name: Build
        working-directory: frontend
        env:
          CI: "false" # warnings should not fail the build; errors still will
          REACT_APP_BACKEND_URL: http://localhost:8001
        run: npm run build
