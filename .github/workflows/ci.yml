name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    env:
      # The unit suite never opens a connection — Motor connects lazily — but
      # importing server.py reads these at module scope.
      MONGO_URL: mongodb://localhost:27017
      DB_NAME: wearecreators_ci
      JWT_SECRET: ci-secret-not-used-for-anything-real
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        working-directory: backend
        # requirements-dev.txt pulls in requirements.txt, so this installs the
        # real runtime set plus the test tooling. It used to hand-list packages
        # to work around one that was not installable from PyPI — which meant
        # CI was quietly testing a different dependency set from the one being
        # deployed.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Import check
        working-directory: backend
        run: python -c "import server; print(f'{len(server.app.routes)} routes registered')"

      - name: Lint (syntax and undefined names only)
        working-directory: backend
        run: flake8 server.py --select=E9,F63,F7,F82,F821 --show-source

      - name: Unit tests
        working-directory: backend
        # tests/ (the integration suite) needs a running preview backend and
        # greps the supervisor log for OTP codes, so it cannot gate a PR.
        # tests/unit runs anywhere.
        run: python -m pytest tests/unit -q

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        # `npm ci` installs exactly the committed lockfile and fails if
        # package.json and package-lock.json disagree — which is the point of
        # committing one. No --legacy-peer-deps: the peer tree resolves
        # cleanly now that date-fns satisfies react-day-picker and the stale
        # react peer is overridden.
        run: npm ci --no-audit --no-fund

      - name: Build
        working-directory: frontend
        env:
          CI: "false" # warnings should not fail the build; errors still will
          REACT_APP_BACKEND_URL: http://localhost:8001
        run: npm run build
